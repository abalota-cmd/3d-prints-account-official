<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Print Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 32px 0;
            line-height: 1.5;
        }

        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 16px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 28px;
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .file-drop-area {
            border: 2px dashed var(--border);
            background: rgba(15, 23, 42, 0.4);
            padding: 40px 20px;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-drop-area:hover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.02);
        }

        .file-drop-area input[type="file"] {
            display: none;
        }

        #fileLabel {
            font-size: 14px;
            color: var(--text-muted);
            display: block;
            line-height: 1.5;
        }

        .input-stack input {
            margin-bottom: 12px;
        }
        .input-stack input:last-child {
            margin-bottom: 0;
        }

        button {
            background-color: #10b981; /* Clean emerald green for checkout */
            color: #0f172a;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>3D Print Studio</h1>
    <p class="subtitle">Upload your 3D design file to receive a custom production quote.</p>

    <!-- Form connected to FormSubmit backend -->
    <form action="https://formsubmit.co" method="POST" enctype="multipart/form-data">
        
        <!-- Anti-spam and configuration hidden inputs -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://paypal.me"> 

        <!-- Part 1: The File -->
        <div class="form-group">
            <div class="section-title">01. Upload Model</div>
            <div class="file-drop-area" onclick="document.getElementById('fileInput').click()">
                <span id="fileLabel">Drag & drop your .STL or .OBJ file here<br><span style="font-size: 12px; color: #64748b;">or click to browse</span></span>
                <input type="file" id="fileInput" name="3D-Model-File" accept=".stl,.obj" required onchange="updateFileName()">
            </div>
        </div>

        <!-- Part 2: Details -->
        <div class="form-group">
            <div class="section-title">02. Specifications</div>
            <textarea name="Instructions" id="instructions" rows="2" placeholder="Color, material, infill, or size preferences..."></textarea>
        </div>

        <!-- Part 3: Shipping -->
        <div class="form-group">
            <div class="section-title">03. Shipping Details</div>
            <div class="input-stack">
                <input type="text" name="Full Name" placeholder="Full Name" required>
                <input type="email" name="Email" placeholder="Email Address" required>
                <input type="text" name="Address" placeholder="Street Address" required>
                <input type="text" name="City-State-Zip" placeholder="City, State, and Zip Code" required>
            </div>
        </div>

        <!-- Submit & Pay -->
        <button type="submit">Submit & Proceed to Pay</button>
    </form>
</div>

<script>
    function updateFileName() {
        const input = document.getElementById('fileInput');
        const label = document.getElementById('fileLabel');
        if (input.files.length > 0) {
            label.innerHTML = "Selected File:<br><span style='color: #38bdf8; font-weight: 600; font-size: 15px;'>" + input.files.name + "</span>";
        }
    }
</script>

</body>
</html>
